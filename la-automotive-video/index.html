<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>LA Automotive motion</title>
<style>
  html,body{margin:0;background:#0b0b0c;overflow:hidden}
  canvas{display:block;height:100vh;width:auto;margin:0 auto}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<svg width="0" height="0" style="position:absolute"><path id="mp"/></svg>
<script>
/* LA Automotive – 25s 9:16 flat motion graphic.
   One clock: every frame is computed from t alone. window.seek(t) draws that moment.
   No text, no logos. Top third (y < 640) stays empty for overlays. */
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 1080, H = 1920, DUR = 25;
const C = {
  bg: '#0b0b0c', ink: '#f4f4f1', surf: '#161618', surf2: '#202024', dark: '#1b1b1e',
  mute: 'rgba(244,244,241,0.10)', mute2: 'rgba(244,244,241,0.32)',
  orange: '#ff8a1f', green: '#2fd27a', sun: '#ffb04a', tail: '#ff6b3d'
};

/* ---------- helpers ---------- */
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eb = k => { const c1 = 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const f = n => n.toFixed(2);

const mp = document.getElementById('mp'); const LC = new Map();
function plen(d) { let v = LC.get(d); if (v === undefined) { mp.setAttribute('d', d); v = mp.getTotalLength(); if (LC.size > 4000) LC.clear(); LC.set(d, v); } return v; }
function strokeD(d, p, col, w, a = 1) {
  if (p <= 0 || a <= 0) return;
  const L = plen(d); x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w;
  x.lineCap = 'round'; x.lineJoin = 'round'; if (p < 1) x.setLineDash([L * p, L + 2]);
  x.stroke(new Path2D(d)); x.restore();
}
function fillD(d, col, a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.fillStyle = col; x.fill(new Path2D(d)); x.restore(); }
function rr(cx, cy, w, h, r, tip = 0) {
  w = Math.max(w, .01); h = Math.max(h, .01);
  const x0 = cx - w / 2, y0 = cy - h / 2, x1 = cx + w / 2, y1 = cy + h / 2; r = Math.max(0, Math.min(r, w / 2, h / 2));
  return `M${f(x0 + r)} ${f(y0)}L${f(x1 - r)} ${f(y0)}Q${f(x1)} ${f(y0)} ${f(x1)} ${f(y0 + r)}L${f(x1)} ${f(y1 - r)}Q${f(x1)} ${f(y1)} ${f(x1 - r)} ${f(y1)}L${f(x0 + r)} ${f(y1)}Q${f(x0)} ${f(y1)} ${f(x0)} ${f(y1 - r)}L${f(x0 - tip)} ${f(cy)}L${f(x0)} ${f(y0 + r)}Q${f(x0)} ${f(y0)} ${f(x0 + r)} ${f(y0)}Z`;
}
function circ(cx, cy, r, start = -Math.PI / 2) { // full circle as arcs, starting at `start`
  const p = a => `${f(cx + r * Math.cos(a))} ${f(cy + r * Math.sin(a))}`;
  return `M${p(start)}A${f(r)} ${f(r)} 0 1 1 ${p(start + Math.PI)}A${f(r)} ${f(r)} 0 1 1 ${p(start + 2 * Math.PI - 1e-4)}`;
}
function arc(cx, cy, r, a0, a1) {
  const p = a => `${f(cx + r * Math.cos(a))} ${f(cy + r * Math.sin(a))}`;
  return `M${p(a0)}A${f(r)} ${f(r)} 0 ${(a1 - a0) > Math.PI ? 1 : 0} 1 ${p(a1)}`;
}
function dot(cx, cy, r, col, a = 1) { if (a <= 0 || r <= 0) return; x.save(); x.globalAlpha *= a; x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); x.restore(); }
function ring(cx, cy, r, col, w, a = 1) { if (a <= 0 || r <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke(); x.restore(); }
function line(x1, y1, x2, y2, col, w, a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); x.restore(); }
function at(cx, cy, s, fn, rot = 0) { x.save(); x.translate(cx, cy); if (rot) x.rotate(rot); x.scale(s, s); fn(); x.restore(); }

/* Check-engine light, 100x100 box centred on 0,0 */
const ENGINE = 'M-22 -16H-8V-22H-16V-28H12V-22H4V-16H20L28 -8H36V-14H42V18H36V12H28L20 24H-14L-22 16H-30V8H-38V-6H-30V-8Z';
function engine(cx, cy, size, col, drawP, fillA) {
  at(cx, cy, size / 100, () => {
    if (fillA > 0) fillD(ENGINE, col, fillA);
    strokeD(ENGINE, drawP, col, 7);
  });
}

/* Side-view car, local box 0..484 x 0..160 (wheel bottoms at y=160) */
const CAR_BODY = 'M16 118L16 100Q18 86 40 82L128 74L180 38Q196 28 220 28L318 28Q344 28 362 44L398 74L448 82Q468 86 470 104L470 118Q470 126 462 126L24 126Q16 126 16 118Z';
const CAR_WIN_F = 'M278 42L316 42Q334 42 348 56L362 72L278 72Z';
const CAR_WIN_R = 'M264 42L264 72L150 72L184 48Q192 42 204 42Z';
function sideCar(spin, bodyCol = C.ink) {
  fillD(CAR_BODY, bodyCol);
  fillD(CAR_WIN_F, C.dark); fillD(CAR_WIN_R, C.dark);
  line(30, 100, 470, 100, C.dark, 3, .35);
  [[112, 126], [380, 126]].forEach(([wx, wy]) => {
    dot(wx, wy, 36, C.bg); ring(wx, wy, 30, bodyCol, 9);
    dot(wx, wy, 12, bodyCol);
    for (let k = 0; k < 5; k++) { const a = spin + k * 1.2566; dot(wx + Math.cos(a) * 19, wy + Math.sin(a) * 19, 3.2, bodyCol); }
  });
  x.save(); x.fillStyle = C.orange; x.globalAlpha *= .9; x.fill(new Path2D('M452 88L470 92L470 104L456 102Z')); x.restore();
}

/* ---------- background ---------- */
const grid = document.createElement('canvas'); grid.width = W; grid.height = H;
(() => { const g = grid.getContext('2d');
  for (let yy = 30; yy < H; yy += 60) for (let xx = 30; xx < W; xx += 60) {
    const a = 0.055 * cl((yy - 660) / 160); if (a <= 0) continue;
    g.fillStyle = `rgba(244,244,241,${a})`; g.beginPath(); g.arc(xx, yy, 1.8, 0, 7); g.fill(); }
})();

/* ---------- morphing container ---------- */
const S = {
  dash: { cx: 540, cy: 1200, w: 920, h: 560, r: 80, tip: 0 },
  phone: { cx: 540, cy: 1190, w: 460, h: 880, r: 66, tip: 0 },
  tag: { cx: 580, cy: 1190, w: 540, h: 300, r: 34, tip: 120 },
  cal: { cx: 540, cy: 1200, w: 600, h: 600, r: 48, tip: 0 },
  floor: { cx: 540, cy: 1560, w: 960, h: 6, r: 3, tip: 0 },
  dot: { cx: 870, cy: 960, w: 24, h: 24, r: 12, tip: 0 },
  mini: { cx: 870, cy: 960, w: 210, h: 402, r: 34, tip: 0 }
};
const SEGS = [
  [3.3, 4.1, 'dash', 'phone', eio], [7.4, 8.2, 'phone', 'tag', eb], [9.8, 10.5, 'tag', 'cal', eio],
  [13.0, 13.7, 'cal', 'floor', eio], [17.3, 17.9, 'dot', 'mini', eb], [18.7, 19.4, 'mini', 'phone', eio]
];
function cont(t) {
  let st = S.dash;
  for (const [a, b, A, B, e] of SEGS) {
    if (t >= b) { st = S[B]; continue; }
    if (t >= a) { const k = e(P(t, a, b)); st = {}; for (const key in S[A]) st[key] = lerp(S[A][key], S[B][key], k); }
    break;
  }
  return st;
}
function contAlpha(t) {
  if (t < 13.6) return 1;
  if (t < 13.75) return 1 - P(t, 13.6, 13.75);
  if (t < 17.3) return 0;
  return P(t, 17.3, 17.45) * (1 - P(t, 20.9, 21.4));
}
function drawCont(t, st) {
  const a = contAlpha(t); if (a <= 0) return;
  const d = rr(st.cx, st.cy, st.w, st.h, st.r, st.tip);
  x.save(); x.globalAlpha = a;
  fillD(d, C.surf, P(t, 0.4, 1.2));
  strokeD(d, eo(P(t, 0.05, 1.15)), C.ink, 6);
  x.restore();
}

/* ---------- scenes ---------- */
function sDash(t) {
  const out = P(t, 3.15, 3.6), a = 1 - out; if (a <= 0) return;
  x.save(); x.globalAlpha = a; const sc = 1 - 0.1 * eio(out);
  x.translate(540, 1200); x.scale(sc, sc); x.translate(-540, -1200);
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  [[320, 1200], [760, 1200]].forEach(([gx, gy], i) => {
    const st = 0.35 + i * 0.15;
    strokeD(arc(gx, gy, 150, a0, a1), eo(P(t, st, st + 0.8)), C.mute2, 10);
    for (let k = 0; k <= 10; k++) {
      const kp = eo(P(t, st + 0.3 + k * 0.04, st + 0.5 + k * 0.04)); if (kp <= 0) continue;
      const an = a0 + (a1 - a0) * k / 10, r2 = k % 5 === 0 ? 96 : 108;
      line(gx + Math.cos(an) * 124, gy + Math.sin(an) * 124, gx + Math.cos(an) * r2, gy + Math.sin(an) * r2, C.ink, k % 5 === 0 ? 6 : 4, kp);
    }
    const np = eo(P(t, st + 0.55, st + 1.4));
    const tgt = (i === 0 ? 0.46 : 0.28) + Math.sin(t * 2.6 + i) * 0.012 * np;
    const an = a0 + (a1 - a0) * tgt * np;
    const na = P(t, st + 0.5, st + 0.7);
    line(gx, gy, gx + Math.cos(an) * 112, gy + Math.sin(an) * 112, C.ink, 7, na);
    dot(gx, gy, 16, C.ink, na);
    // small readout pill in the open part of the gauge
    const bp = eo(P(t, st + 0.8, st + 1.3));
    fillD(rr(gx, gy + 112, 120, 14, 7), C.mute, bp);
    if (bp > 0) fillD(rr(gx - 60 + 60 * (i ? .55 : .75) * bp, gy + 112, 120 * (i ? .55 : .75) * bp, 14, 7), C.ink, bp);
  });
  // indicator dots row
  for (let k = 0; k < 5; k++) dot(540 - 80 + k * 40, 1400, 7, C.mute2, eo(P(t, 0.9 + k * 0.05, 1.2 + k * 0.05)));
  x.restore();
}

function warnIcon(t) {
  // continuous element: dashboard light -> phone header icon
  const a = P(t, 1.3, 1.35) * (1 - P(t, 7.15, 7.45)); if (a <= 0) return;
  const k = eio(P(t, 3.3, 4.1));
  const cx = 540, cy = lerp(1200, 900, k), size = lerp(130, 74, k);
  const pop = t < 2.2 ? eb(P(t, 1.55, 1.9)) : 1;
  x.save(); x.globalAlpha = a;
  // pulse rings
  if (t > 1.85 && t < 3.4) { const ph = ((t - 1.85) % 0.75) / 0.75; ring(cx, cy, 80 + 70 * ph, C.orange, 5, (1 - ph) * 0.55); }
  if (t > 4.3 && t < 7.1) { const ph = ((t - 4.3) % 1.1) / 1.1; ring(cx, cy, 46 + 34 * ph, C.orange, 4, (1 - ph) * 0.4); }
  dot(cx, cy, size * 0.72 * pop, C.orange, 0.14 * P(t, 1.55, 1.9));
  engine(cx, cy, size * (t < 1.55 ? 1 : pop), C.orange, P(t, 1.3, 1.7), P(t, 1.55, 1.75));
  x.restore();
}

function sPhone(t, st) {
  const a = P(t, 3.9, 4.3) * (1 - P(t, 7.05, 7.35)); if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  const top = st.cy - st.h / 2;
  fillD(rr(st.cx, top + 36, 110, 22, 11), C.ink, 0.9);
  fillD(rr(540, st.cy + st.h / 2 - 28, 140, 8, 4), C.mute2, 1);
  // skeleton UI lines
  fillD(rr(540, 1004, 250 * eo(P(t, 4.3, 4.7)), 16, 8), C.mute2, P(t, 4.3, 4.4));
  fillD(rr(540, 1038, 170 * eo(P(t, 4.4, 4.8)), 16, 8), C.mute, P(t, 4.4, 4.5));
  // licence plate field
  const py = 1150, pw = 380, ph = 100, px0 = 540 - pw / 2;
  fillD(rr(540, py, pw, ph, 14), C.surf2, P(t, 4.5, 4.9));
  strokeD(rr(540, py, pw, ph, 14), eo(P(t, 4.4, 4.95)), C.ink, 5);
  const sp = P(t, 4.8, 5.0);
  fillD(rr(px0 + 30, py, 44, ph - 16, 9), C.mute2, sp);
  for (let k = 0; k < 12; k++) { const an = k / 12 * Math.PI * 2; dot(px0 + 30 + Math.cos(an) * 12, py - 14 + Math.sin(an) * 12, 2.4, C.ink, sp); }
  fillD(rr(px0 + 30, py + 24, 20, 8, 3), C.ink, sp);
  // characters XX-XX-XX as abstract blocks
  const xs = [422, 462, 532, 572, 642, 682], dashes = [510, 620];
  let lastX = 412;
  xs.forEach((cx0, i) => {
    const s = 5.0 + i * 0.16, k = P(t, s, s + 0.22); if (k <= 0) return;
    const sc = eb(k); lastX = cx0 + 15 + 10;
    fillD(rr(cx0 + 15, py, 30 * sc, 52 * sc, 6), C.ink, P(t, s, s + 0.05));
    if (i === 1 || i === 3) fillD(rr(dashes[i >> 1], py, 14, 6, 3), C.ink, P(t, s + 0.08, s + 0.14));
  });
  const caretOn = t < 5.0 ? Math.floor(t * 2.6) % 2 === 0 : t < 6.0;
  if (caretOn && t > 4.9) fillD(rr(lastX, py, 4, 58, 2), C.orange, 1);
  // button + tap
  const by = 1330;
  const fillOn = P(t, 6.2, 6.35);
  fillD(rr(540, by, 300, 84, 42), C.orange, fillOn);
  strokeD(rr(540, by, 300, 84, 42), eo(P(t, 5.7, 6.1)), fillOn > 0.5 ? C.orange : C.ink, 5);
  strokeD('M528 1312L546 1330L528 1348', eo(P(t, 5.95, 6.15)), fillOn > 0.5 ? C.bg : C.ink, 7);
  const fa = P(t, 5.85, 6.0) * (1 - P(t, 6.3, 6.5));
  const fy = lerp(1420, 1342, eo(P(t, 5.85, 6.18)));
  dot(600, fy, 22 * (t > 6.18 ? 0.85 : 1), C.ink, fa * 0.9);
  if (t > 6.2 && t < 6.75) { const k = P(t, 6.2, 6.75); ring(600, 1340, 14 + 90 * eo(k), C.ink, 4, (1 - k) * 0.7); }
  x.restore();
}

function sTag(t, st) {
  const a = P(t, 8.0, 8.25) * (1 - P(t, 9.6, 9.85)); if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  const hx = st.cx - st.w / 2 + 34, hy = st.cy;
  strokeD(`M${f(hx)} ${f(hy)}C${f(hx - 70)} ${f(hy - 110)} ${f(hx - 10)} ${f(hy - 190)} ${f(hx - 120)} ${f(hy - 250)}`, eo(P(t, 8.1, 8.6)), C.mute2, 5);
  dot(hx, hy, 17, C.bg); ring(hx, hy, 17, C.ink, 5);
  const bx = st.cx - 150, k1 = eo(P(t, 8.2, 8.6));
  if (k1 > 0) fillD(rr(bx + 120 * k1, st.cy - 46, 240 * k1, 56, 14), C.ink);
  const k2 = eo(P(t, 8.35, 8.7)), k3 = eo(P(t, 8.45, 8.8));
  if (k2 > 0) fillD(rr(bx + 130 * k2, st.cy + 30, 260 * k2, 16, 8), C.mute2);
  if (k3 > 0) fillD(rr(bx + 90 * k3, st.cy + 64, 180 * k3, 16, 8), C.mute);
  // "fixed" badge
  const bxp = st.cx + st.w / 2 - 22, byp = st.cy - st.h / 2 + 8, bk = eb(P(t, 8.7, 9.0));
  if (bk > 0) {
    dot(bxp, byp, 52 * bk, C.ink);
    strokeD(`M${bxp - 21} ${byp + 1}L${bxp - 6} ${byp + 16}L${bxp + 22} ${byp - 14}`, eo(P(t, 8.85, 9.12)), C.bg, 9);
  }
  // subtle sparkle ticks around badge
  if (t > 9.0 && t < 9.5) { const k = P(t, 9.0, 9.5); for (let i = 0; i < 6; i++) { const an = i / 6 * Math.PI * 2 - .3; const r0 = 64 + 26 * eo(k); line(bxp + Math.cos(an) * r0, byp + Math.sin(an) * r0, bxp + Math.cos(an) * (r0 + 14), byp + Math.sin(an) * (r0 + 14), C.ink, 4, 1 - k); } }
  x.restore();
}

function sCal(t, st) {
  const a = P(t, 10.3, 10.6) * (1 - P(t, 12.9, 13.15)); if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  const y0 = st.cy - st.h / 2;
  x.save(); x.clip(new Path2D(rr(st.cx, st.cy, st.w, st.h, st.r)));
  x.globalAlpha *= P(t, 10.45, 10.75); x.fillStyle = C.surf2; x.fillRect(st.cx - st.w / 2, y0, st.w, 112);
  x.restore();
  fillD(rr(540, y0 + 56, 190 * eo(P(t, 10.55, 10.9)), 18, 9), C.mute2, 1);
  [-150, 150].forEach((dx, i) => { const k = eb(P(t, 10.45 + i * .06, 10.75 + i * .06)); if (k > 0) fillD(rr(540 + dx, y0, 22, 64 * k, 11), C.ink); });
  for (let i = 0; i < 5; i++) for (let j = 0; j < 7; j++) {
    const cx = 318 + 74 * j, cy = 1032 + 84 * i;
    const d0 = 10.6 + (i + j) * 0.03;
    strokeD(rr(cx, cy, 54, 54, 14), eo(P(t, d0, d0 + 0.25)), C.mute2, 3);
    let k;
    if (j < 5) { const s = 11.1 + (i * 5 + j) * 0.024; k = eo(P(t, s, s + 0.2)); }
    else { const s = 12.0 + i * 0.06 + (j - 5) * 0.03; k = eb(P(t, s, s + 0.3)); }
    if (k > 0) fillD(rr(cx, cy, 54 * k, 54 * k, 14 * k), C.ink, Math.min(1, k * 2));
  }
  strokeD(rr(725, 1200, 160, 424, 26), eo(P(t, 12.3, 12.85)), C.ink, 5);
  x.restore();
}

/* workshop timing */
const FLOOR = 1560;
const platY = t => 1520 - 160 * eio(P(t, 15.6, 16.4));
const carX = t => lerp(-560, 297, eo(P(t, 14.55, 15.45)));
function hotspot(t) { return [carX(t) + 410, platY(t) - 110]; }

function sShop(t) {
  const a = P(t, 13.6, 13.75) * (1 - P(t, 18.7, 19.2)); if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  const dim = 1 - 0.6 * P(t, 17.2, 17.6);
  line(60, FLOOR, 1020, FLOOR, C.ink, 6);
  strokeD('M90 1560V900L540 730L990 900V1560', eo(P(t, 13.8, 14.8)), C.mute2, 6, dim);
  // lamp
  const la = P(t, 14.6, 14.9) * dim;
  line(540, 734, 540, 800, C.mute2, 4, la);
  fillD('M500 832L522 800L558 800L580 832Z', C.ink, la);
  fillD('M505 836L575 836L700 1180L380 1180Z', C.ink, la * 0.05);
  // lift posts
  const pk = eo(P(t, 14.2, 14.7));
  [250, 830].forEach(px => { if (pk > 0) { fillD(rr(px, FLOOR - 190 * pk, 28, 380 * pk, 6), C.mute2); fillD(rr(px, FLOOR - 380 * pk, 44, 14, 5), C.ink, pk); } });
  const py = platY(t);
  fillD(rr(540, py + 8, 620, 16, 8), C.ink, P(t, 14.5, 14.8));
  // car
  const cxL = carX(t);
  if (t > 14.5) at(cxL, py - 160, 1, () => sideCar(cxL / 34));
  // warning badge on car
  const [hx, hy] = hotspot(t);
  const wb = eb(P(t, 15.25, 15.55));
  if (wb > 0) {
    const bx = cxL + 430, by = py - 205;
    dot(bx, by, 30 * wb, C.orange);
    engine(bx, by, 36 * wb, C.bg, 1, 1);
  }
  // mechanic badge
  const mk = eb(P(t, 16.0, 16.35));
  if (mk > 0) at(170, 1100, mk, () => {
    dot(0, 0, 62, C.surf); ring(0, 0, 62, C.ink, 5);
    fillD('M-30 40Q-30 8 0 8Q30 8 30 40Z', C.ink);
    dot(0, -12, 17, C.ink);
    fillD('M-19 -20Q-19 -40 0 -40Q19 -40 19 -20Z', C.orange);
    fillD(rr(8, -21, 30, 7, 3), C.orange);
  });
  // tablet + scan beam
  const sk = P(t, 16.45, 17.45);
  if (sk > 0 && sk < 1) {
    const bxs = lerp(300, 790, eio(sk)), ta = Math.sin(Math.PI * sk);
    x.save(); x.globalAlpha *= 0.16 * ta; x.fillStyle = C.orange; x.fillRect(bxs - 40, py - 180, 40, 186); x.restore();
    line(bxs, py - 186, bxs, py + 4, C.orange, 5, ta);
    strokeD(`M232 1100L${f(bxs)} ${f(py - 186)}`, 1, C.orange, 3, ta * 0.35);
  }
  // hotspot found
  if (t > 17.1) {
    const k = P(t, 17.1, 17.4);
    ring(hx, hy, 34 * eb(k), C.orange, 5, 1);
    const ph = ((t - 17.1) % 0.7) / 0.7; ring(hx, hy, 34 + 30 * ph, C.orange, 3, (1 - ph) * 0.5 * k);
  }
  x.restore();
}

/* photo card that flies from car to customer phone */
function photoCard(cx, cy, s, rot, dotCol) {
  at(cx, cy, s, () => {
    fillD(rr(0, 0, 160, 116, 16), C.surf2); strokeD(rr(0, 0, 160, 116, 16), 1, C.ink, 4);
    at(-62, -18, 0.26, () => sideCar(0));
    fillD(rr(0, 40, 110, 8, 4), C.mute2);
    dot(56, -36, 11, dotCol);
  }, rot);
}
function sFlight(t) {
  if (t < 17.55 || t > 18.35) return;
  const [hx, hy] = hotspot(t);
  const k = eio(P(t, 17.7, 18.3));
  const ex = 870, ey = 930;
  const cx = (1 - k) ** 2 * hx + 2 * (1 - k) * k * 760 + k * k * ex;
  const cy = (1 - k) ** 2 * hy + 2 * (1 - k) * k * 760 + k * k * ey;
  const s = eb(P(t, 17.55, 17.75)) * lerp(1, 0.72, k);
  photoCard(cx, cy, s, Math.sin(Math.PI * k) * 0.18, C.orange);
}
function flash(t) {
  if (t < 17.5 || t > 17.85) return;
  x.save(); x.globalAlpha = 0.22 * (1 - P(t, 17.5, 17.85)); x.fillStyle = C.ink; x.fillRect(0, 640, W, H - 640); x.restore();
}

/* customer phone content (phone-local coords, 460x880 design) */
function sCustomer(t, st) {
  if (t < 17.3) return;
  const a = contAlpha(t); if (a <= 0) return;
  const s = st.w / 460;
  x.save(); x.globalAlpha = a; x.translate(st.cx, st.cy); x.scale(s, s);
  fillD(rr(0, -404, 110, 22, 11), C.ink, 0.9 * P(t, 17.6, 17.8));
  const green = P(t, 19.8, 20.0);
  const dc = green > 0 ? mix(C.orange, C.green, green) : C.orange;
  if (t >= 18.3) {
    const k = eb(P(t, 18.3, 18.55));
    at(-40, -190, 1.75 * k, () => photoCard(0, 0, 1, 0, dc));
    fillD(rr(-55, -10, 250, 18, 9), C.mute2, P(t, 18.45, 18.6));
    fillD(rr(-85, 26, 190, 18, 9), C.mute, P(t, 18.5, 18.65));
  }
  // notification dot
  const nk = eb(P(t, 18.32, 18.55)) * (1 - P(t, 18.8, 19.0));
  if (nk > 0) dot(196, -420, 26 * nk, C.orange);
  // approve button
  const by = 250, fillOn = P(t, 19.6, 19.75);
  fillD(rr(0, by, 320, 92, 46), C.green, fillOn);
  strokeD(rr(0, by, 320, 92, 46), eo(P(t, 19.15, 19.5)), fillOn > 0.5 ? C.green : C.ink, 5);
  strokeD(`M-22 ${by}L-6 ${by + 16}L24 ${by - 14}`, eo(P(t, 19.3, 19.5)), fillOn > 0.5 ? C.bg : C.ink, 7);
  const fa = P(t, 19.3, 19.42) * (1 - P(t, 19.7, 19.85));
  dot(60, lerp(360, by + 6, eo(P(t, 19.3, 19.58))), 22, C.ink, fa * 0.9);
  if (t > 19.6 && t < 20.1) { const k = P(t, 19.6, 20.1); ring(60, by + 6, 14 + 100 * eo(k), C.ink, 4, (1 - k) * 0.7); }
  // veil behind the hero check
  fillD(rr(0, 0, 460, 880, 66), C.bg, 0.55 * P(t, 19.75, 20.0));
  fillD(rr(0, -404, 110, 22, 11), C.ink, 0.9 * P(t, 19.75, 20.0));
  x.restore();
}

/* hero circle: approval check -> sunset sun */
const HORIZON = 1250;
function hero(t) {
  if (t < 19.75) return;
  const g = eb(P(t, 19.75, 20.1));
  const m = eio(P(t, 20.9, 21.7));
  const cx = 540, cy = lerp(1230, HORIZON, m) + 70 * eio(P(t, 21.7, 25));
  const r = lerp(130 * g, 230, m);
  const col = m > 0 ? mix(C.green, C.sun, m) : C.green;
  // green pulse rings
  for (let i = 0; i < 2; i++) { const k = P(t, 20.05 + i * 0.22, 20.95 + i * 0.22); if (k > 0 && k < 1) ring(540, 1230, 140 + 360 * eo(k), C.green, 6 - i * 2, (1 - k) * 0.6); }
  dot(cx, cy, r, col);
  const ca = 1 - P(t, 20.9, 21.1);
  if (ca > 0) strokeD(`M${cx - 56} ${cy + 4}L${cx - 16} ${cy + 44}L${cx + 62} ${cy - 40}`, eo(P(t, 19.95, 20.3)), C.ink, 18, ca);
  // retro stripes once it is a sun
  const sk = eo(P(t, 21.8, 22.3));
  if (sk > 0) {
    x.save(); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.clip(); x.fillStyle = C.bg;
    [[34, 13], [68, 10], [98, 7], [124, 5]].forEach(([dy, hh], i) => { const w = 2 * r * eo(P(t, 21.8 + i * .06, 22.3 + i * .06)); x.fillRect(cx - w / 2, HORIZON - dy - hh / 2, w, hh); });
    x.restore();
  }
}

function sDrive(t) {
  if (t < 21.2) return;
  // ground occluder hides the lower half of the sun
  x.save(); x.globalAlpha = P(t, 21.3, 21.7); x.fillStyle = C.bg; x.fillRect(0, HORIZON, W, H - HORIZON); x.restore();
  // hills
  const hk = eo(P(t, 21.9, 22.5));
  if (hk > 0) {
    x.save(); x.translate(0, 70 * (1 - hk)); x.beginPath(); x.rect(0, 0, W, HORIZON - 70 * (1 - hk)); x.clip();
    fillD('M60 1250L190 1186L280 1214L370 1166L476 1250Z', '#19191c');
    fillD('M604 1250L700 1196L800 1222L905 1174L1020 1250Z', '#19191c');
    x.restore();
  }
  const hp = eo(P(t, 21.3, 21.9));
  line(540, HORIZON, 540 - 480 * hp, HORIZON, C.ink, 5, hp > 0 ? 1 : 0);
  line(540, HORIZON, 540 + 480 * hp, HORIZON, C.ink, 5, hp > 0 ? 1 : 0);
  // road edges
  const rp = eo(P(t, 21.6, 22.3));
  strokeD('M522 1250L120 1940', rp, C.ink, 6); strokeD('M558 1250L960 1940', rp, C.ink, 6);
  // centre dashes in perspective
  const yz = z => HORIZON + 690 / z;
  for (let n = 0; n < 16; n++) {
    const z0 = 1.0 + n * 0.8, z1 = z0 + 0.38, k = P(t, 21.85 + n * 0.035, 22.05 + n * 0.035);
    if (k <= 0) continue;
    const y0 = yz(z0), y1 = yz(z1), w0 = 11 / z0, w1 = 11 / z1;
    fillD(`M${f(540 - w0)} ${f(y0)}L${f(540 + w0)} ${f(y0)}L${f(540 + w1)} ${f(y1)}L${f(540 - w1)} ${f(y1)}Z`, C.ink, k * 0.85);
  }
  // car from behind, driving away
  const ck = P(t, 22.0, 25.2), zc = 1.25 + 5.6 * Math.pow(ck, 1.7);
  const enter = 520 * (1 - eo(P(t, 21.7, 22.35)));
  if (t > 21.7) {
    const s = 1.25 / zc, by = yz(zc) + enter;
    const bob = Math.sin(t * 22) * 1.5 * s;
    at(540, by + bob, s, () => {
      fillD(rr(0, 6, 400, 22, 11), '#000', 0.45);
      fillD(rr(-150, -24, 54, 50, 10), '#2a2a2e'); fillD(rr(150, -24, 54, 50, 10), '#2a2a2e');
      fillD('M-128 -132L-100 -204Q-95 -214 -80 -214L80 -214Q95 -214 100 -204L128 -132Z', C.ink);
      fillD('M-98 -140L-77 -196L77 -196L98 -140Z', C.dark);
      fillD(rr(0, -84, 380, 112, 26), C.ink);
      fillD(rr(-136, -100, 76, 24, 9), C.tail); fillD(rr(136, -100, 76, 24, 9), C.tail);
      fillD(rr(0, -64, 96, 30, 6), C.dark);
      line(-170, -44, 170, -44, C.dark, 4, 0.35);
    });
  }
}

/* ---------- frame ---------- */
function draw(t) {
  t = cl(t, 0, DUR);
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.setLineDash([]);
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  x.globalAlpha = P(t, 0, 0.6) * (1 - 0.7 * P(t, 21.2, 21.8)); x.drawImage(grid, 0, 0); x.globalAlpha = 1;
  const st = cont(t);
  drawCont(t, st);
  sDash(t);
  sPhone(t, st);
  sTag(t, st);
  sCal(t, st);
  sShop(t);
  sCustomer(t, st);
  sFlight(t);
  warnIcon(t);
  hero(t);
  sDrive(t);
  flash(t);
}

window.seek = t => { draw(t); return true; };
window.DURATION = DUR;
if (!location.search.includes('render')) {
  const t0 = performance.now();
  const loop = () => { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else draw(0);
</script>
